<a [routerLink]="['/courses']" class="back">← უკან</a>

@if (page.loading()) {
<p class="muted">იტვირთება...</p>
} @else {
<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2>კურსის მონაცემები</h2>
  <div class="grid">
    <div class="field">
      <label for="name">სახელწოდება</label>
      <input id="name" formControlName="name">
      @if (invalid('name')) { <span class="hint">2-დან 50 სიმბოლომდე</span> }
    </div>
    <div class="field">
      <label for="duration">ხანგრძლივობა (კვირა)</label>
      <input id="duration" type="number" formControlName="DurationInWeeks" min="1" max="104">
      @if (invalid('DurationInWeeks')) { <span class="hint">უნდა იყოს 1-დან 104 კვირამდე</span> }
    </div>
  </div>

  <div class="field">
    <label for="description">აღწერა</label>
    <textarea id="description" formControlName="Description" rows="4" maxlength="500"></textarea>
    @if (invalid('Description')) { <span class="hint">2-დან 500 სიმბოლომდე</span> }
  </div>

  <h2>სტატუსი</h2>
  <div class="field checkbox">
    <label for="active">
      <input id="active" type="checkbox" formControlName="IsActive">
      აქტიური
    </label>
  </div>

  @if (page.error(); as error) {
  <div class="alert">{{ error }}</div>
  }

  <div class="actions">
    <!-- <a [routerLink]="isEdit() ? ['/courses', courseId()] : ['/courses']" class="btn-secondary">გაუქმება</a> -->
    <button type="submit" class="btn" [disabled]="page.saving()">
      {{ page.saving() ? 'ინახება...' : 'შენახვა' }}
    </button>
  </div>
</form>
}
